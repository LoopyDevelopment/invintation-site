<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Приглашение на свидание 💌</title>

  <style>
    :root {
      --pink: #e96b8b;
      --pink-dark: #cf4c70;
      --cream: #fffaf5;
      --ink: #493b43;
      --muted: #806f77;
      --card: rgba(255, 255, 255, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Trebuchet MS", Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 15%, #ffe4eb 0 8%, transparent 9%),
        radial-gradient(circle at 90% 85%, #ffe8d8 0 10%, transparent 11%),
        linear-gradient(135deg, #fff2f5, #fff9ed 55%, #f9efff);
    }

    .heart {
      position: fixed;
      z-index: 0;
      bottom: -40px;
      color: #e98aa3;
      opacity: 0.55;
      pointer-events: none;
      animation: float-up linear infinite;
    }

    @keyframes float-up {
      from {
        transform: translateY(0) rotate(0);
        opacity: 0;
      }
      15% {
        opacity: 0.55;
      }
      to {
        transform: translateY(-115vh) rotate(30deg);
        opacity: 0;
      }
    }

    #app {
      position: relative;
      z-index: 1;
      width: min(100%, 700px);
    }

    .card {
      padding: clamp(24px, 6vw, 48px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 18px 60px rgba(142, 88, 108, 0.16);
      backdrop-filter: blur(12px);
      animation: appear 350ms ease-out;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--pink-dark);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 7vw, 3.2rem);
      line-height: 1.08;
    }

    .description {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.6;
    }

    .date {
      display: inline-block;
      margin: 2px 0 26px;
      padding: 12px 17px;
      border-radius: 999px;
      color: #a53659;
      background: #ffe8ee;
      font-weight: 800;
    }

    .answer-area {
      position: relative;
      min-height: 76px;
      margin-top: 10px;
    }

    button,
    .button {
      min-height: 48px;
      padding: 12px 20px;
      border: 0;
      border-radius: 15px;
      color: white;
      background: var(--pink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    button:hover,
    .button:hover {
      background: var(--pink-dark);
      box-shadow: 0 8px 20px rgba(207, 76, 112, 0.2);
      transform: translateY(-2px);
    }

    .yes-button {
      position: absolute;
      top: 8px;
      left: 12%;
    }

    .no-button {
      position: absolute;
      top: 8px;
      left: 58%;
      background: #b9aab0;
    }

    .no-button:hover {
      background: #b9aab0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .option {
      width: 100%;
      min-height: 100px;
      padding: 18px;
      text-align: left;
      color: var(--ink);
      background: #fff;
      border: 1px solid #f3dce3;
      border-radius: 18px;
    }

    .option:hover {
      color: var(--ink);
      background: #fff7f9;
      border-color: #eba4b7;
    }

    .option strong,
    .option small {
      display: block;
    }

    .option strong {
      margin-bottom: 7px;
      font-size: 1rem;
    }

    .option small {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.45;
    }

    .event-list {
      display: grid;
      gap: 14px;
    }

    .event {
      padding: 18px;
      border: 1px solid #f3dce3;
      border-radius: 18px;
      background: #fff;
    }

    .event a {
      color: #a53659;
      font-weight: 800;
      line-height: 1.5;
    }

    .event .button {
      margin-top: 12px;
    }

    .back-button {
      margin-top: 22px;
      color: var(--pink-dark);
      background: #ffe8ee;
    }

    .back-button:hover {
      color: white;
    }

    .food-grid {
      margin: 18px 0 24px;
    }

    .food-option {
      min-height: 58px;
      text-align: center;
      font-size: 1rem;
    }

    .food-option.selected {
      color: white;
      background: var(--pink-dark);
      border-color: var(--pink-dark);
    }

    .submit-button {
      width: 100%;
      margin-top: 4px;
    }

    .note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .yes-button {
        left: 4%;
      }

      .no-button {
        left: 55%;
      }
    }
  </style>
</head>

<body>
  <div id="hearts" aria-hidden="true"></div>
  <main id="app"></main>

  <script>
    const app = document.querySelector("#app");

    const state = {
      page: "invite",
      activity: "",
      food: ""
    };

    const activities = [
      {
        id: "exhibition",
        title: "Выставка / мастер-класс"
      },
      {
        id: "cinema",
        title: "Поход в кино"
      },
      {
        id: "books",
        title: "Поход за книгами"
      },
      {
        id: "flea-market",
        title: "Поход по вещевым барахолкам"
      }
    ];

    const events = [
      {
        title: "Выставка «Гидонас Барилкис. Дорога на Север»",
        url: "https://visittyumen.ru/events/vystavka-gidonas-barilkis-doroga-na-sever/"
      },
      {
        title: "Выставка «Увертюра. Врата Сибири»",
        url: "https://visittyumen.ru/events/vystavka-uvertyura-vrata-sibiri/"
      },
      {
        title: "Мастер-класс по деревянной игрушке от Святослава Шитова",
        url: "https://visittyumen.ru/events/master-klass-po-derevyannoy-igrushke-ot-svyatoslava-shitova/"
      }
    ];

    function render() {
      if (state.page === "invite") {
        app.innerHTML = `
          <section class="card">
            <p class="eyebrow">маленькое важное приглашение</p>
            <h1>Пойдёшь со мной на свидание? 💌</h1>
            <p class="description">
              Я придумал и решил, что нам надо идти на свидание. Осталось только узнать,
              согласна ли ты.
            </p>
            <div class="date">Суббота, 24 октября 2026 года ✨</div>
            ${yesNoButtons()}
          </section>`;
      } else if (state.page === "together") {
        app.innerHTML = `
          <section class="card">
            <p class="eyebrow">уточним один важный момент</p>
            <h1>Точно со мной? 🥺</h1>
            <p class="description">💗</p>
            ${yesNoButtons()}
          </section>`;
      } else if (state.page === "activities") {
        app.innerHTML = `
          <section class="card">
            <p class="eyebrow">свидание начинается</p>
            <h1>Чем займёмся? ✨</h1>
            <p class="description">Выбирай, что тебе больше по душе.</p>

            <div class="grid">
              <button class="option" data-action="activity" data-id="exhibition">
                <strong>🎨 Выставка / мастер-класс</strong>
                <small>Посмотрим что-нибудь красивое или создадим что-то сами</small>
              </button>
              <button class="option" data-action="activity" data-id="cinema">
                <strong>🎬 Поход в кино</strong>
                <small>Выберем фильм и устроимся поудобнее</small>
              </button>
              <button class="option" data-action="direct" data-id="books">
                <strong>📚 Поход за книгами</strong>
                <small>Поищем книжные сокровища</small>
              </button>
              <button class="option" data-action="direct" data-id="flea-market">
                <strong>🧥 Поход по вещевым барахолкам</strong>
                <small>Вдруг найдём что-то совершенно особенное</small>
              </button>
            </div>
          </section>`;
      } else if (state.page === "exhibition") {
        app.innerHTML = `
          <section class="card">
            <p class="eyebrow">искусство или творчество?</p>
            <h1>Выставка / мастер-класс 🎨</h1>
            <p class="description">Выбирай, куда отправимся. Ссылки откроются в новой вкладке.</p>

            <div class="event-list">
              ${events.map((event, index) => `
                <article class="event">
                  <a href="${event.url}" target="_blank" rel="noopener noreferrer">
                    ${event.title}
                  </a>
                  <br>
                  <button class="button" data-action="choose-event" data-index="${index}">
                    Выбрать этот вариант
                  </button>
                </article>
              `).join("")}
            </div>

            <button class="back-button" data-action="back">← Назад</button>
          </section>`;
      } else if (state.page === "cinema") {
        app.innerHTML = `
          <section class="card">
            <p class="eyebrow">вечерний сеанс</p>
            <h1>Что посмотрим? 🎬</h1>
            <p class="description">Выбирай фильм — попкорн будет за мной.</p>

            <div class="grid">
              <button class="option" data-action="choose-movie" data-title="Сказка о потерянном времени (КАРО)">
                <strong>⏳ Сказка о потерянном времени</strong>
                <small>Кинотеатр КАРО</small>
              </button>
              <button class="option" data-action="choose-movie" data-title="Обитель зла (Атмос Синема)">
                <strong>🧟 Обитель зла</strong>
                <small>Атмос Синема</small>
              </button>
            </div>

            <button class="back-button" data-action="back">← Назад</button>
          </section>`;
      } else if (state.page === "food") {
        app.innerHTML = `
          <section class="card">
            <p class="eyebrow">и последнее, но очень вкусное</p>
            <h1>Что будем кушать? 🍽️</h1>
            <p class="description">
              Выбери, чем мы будем трапезничать. Твой выбор отправится мне на почту.
            </p>

            <form
              action="https://formsubmit.co/denis-dx@inbox.ru"
              method="POST"
            >
              <input type="hidden" name="_subject" value="Ответ на приглашение на свидание 💌">
              <input type="hidden" name="_template" value="table">
              <input type="hidden" name="_captcha" value="false">
              <input type="hidden" name="Дата свидания" value="Суббота, 24 октября 2026 года">
              <input type="hidden" name="План" value="${escapeHtml(state.activity)}">
              <input type="hidden" name="Выбор еды" id="food-value">

              <div class="grid food-grid">
                ${["Пицца", "Роллы", "Рамен", "Фьюжн"].map(food => `
                  <button
                    type="button"
                    class="option food-option ${state.food === food ? "selected" : ""}"
                    data-action="food"
                    data-food="${food}"
                  >
                    ${food}
                  </button>
                `).join("")}
              </div>

              <button class="submit-button" type="submit">
                Отправить твой выбор 💌
              </button>
              
            </form>
          </section>`;
      }
    }

    function yesNoButtons() {
      return `
        <div class="answer-area">
          <button class="yes-button" data-action="yes">Да! 💖</button>
          <button class="no-button" data-action="no" type="button">Нет</button>
        </div>`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function goToFood() {
      state.page = "food";
      render();
    }

    function moveNoButton(button) {
      const area = button.closest(".answer-area");
      if (!area) return;

      const maxX = Math.max(0, area.clientWidth - button.offsetWidth);
      const maxY = Math.max(0, area.clientHeight - button.offsetHeight);

      button.style.left = `${Math.random() * maxX}px`;
      button.style.top = `${Math.random() * maxY}px`;
    }

    app.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;

      const action = button.dataset.action;

      if (action === "yes") {
        state.page = state.page === "invite" ? "together" : "activities";
        render();
      }

      if (action === "no") {
        event.preventDefault();
        moveNoButton(button);
      }

      if (action === "activity") {
        state.activity = activities.find(item => item.id === button.dataset.id).title;
        state.page = button.dataset.id;
        render();
      }

      if (action === "direct") {
        state.activity = activities.find(item => item.id === button.dataset.id).title;
        goToFood();
      }

      if (action === "choose-event") {
        state.activity = events[Number(button.dataset.index)].title;
        goToFood();
      }

      if (action === "choose-movie") {
        state.activity = button.dataset.title;
        goToFood();
      }

      if (action === "food") {
        state.food = button.dataset.food;
        render();
      }

      if (action === "back") {
        state.page = "activities";
        render();
      }
    });

    app.addEventListener("pointerover", event => {
      const button = event.target.closest(".no-button");
      if (button) moveNoButton(button);
    });

    app.addEventListener("touchstart", event => {
      const button = event.target.closest(".no-button");
      if (button) {
        event.preventDefault();
        moveNoButton(button);
      }
    }, { passive: false });

    app.addEventListener("submit", event => {
      if (!state.food) {
        event.preventDefault();
        alert("Сначала выбери, что будем кушать 😊");
        return;
      }

      document.querySelector("#food-value").value = state.food;
    });

    function addHearts() {
      const container = document.querySelector("#hearts");

      for (let i = 0; i < 15; i++) {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.textContent = ["♥️", "♡", "💕"][i % 3];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.animationDuration = `${9 + Math.random() * 12}s`;
        heart.style.animationDelay = `${Math.random() * 12}s`;
        heart.style.fontSize = `${14 + Math.random() * 22}px`;
        container.appendChild(heart);
      }
    }

    addHearts();
    render();
  </script>
</body>
</html>
